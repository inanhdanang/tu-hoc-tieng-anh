<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tự Học Tiếng Anh – 1 Giờ Mỗi Ngày</title>
  <meta name="description" content="Chương trình tự học tiếng Anh 30 ngày, mỗi ngày 1 giờ." />
  <meta name="theme-color" content="#1a56db" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <style>
    :root {
      --blue:    #1a56db;
      --blue-dk: #1240a8;
      --blue-lt: #e8f0fe;
      --green:   #0d9e6e;
      --amber:   #d97706;
      --red:     #dc2626;
      --gray-50: #f8fafc;
      --gray-100:#f1f5f9;
      --gray-200:#e2e8f0;
      --gray-400:#94a3b8;
      --gray-600:#475569;
      --gray-800:#1e293b;
      --white:   #ffffff;
      --radius:  12px;
      --shadow:  0 2px 12px rgba(0,0,0,.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100dvh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dk) 100%);
      color: var(--white);
      padding: 24px 16px 20px;
      text-align: center;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 16px rgba(26,86,219,.35);
    }
    header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.3px; }
    header p  { font-size: .82rem; opacity: .85; margin-top: 2px; }

    .stats-row {
      display: flex; justify-content: center; gap: 20px;
      margin-top: 14px;
    }
    .stat { text-align: center; }
    .stat .val { font-size: 1.5rem; font-weight: 800; line-height: 1; }
    .stat .lbl { font-size: .7rem; opacity: .75; margin-top: 2px; }

    /* ── Progress bar ── */
    .progress-wrap {
      background: rgba(255,255,255,.2);
      border-radius: 99px; height: 8px;
      margin: 14px 16px 0;
      overflow: hidden;
    }
    .progress-bar {
      background: #7dd3fc;
      height: 100%; border-radius: 99px;
      transition: width .5s ease;
    }
    .progress-label {
      font-size: .72rem; opacity: .8; margin-top: 4px; text-align: center;
    }

    /* ── Search / filter ── */
    .toolbar {
      padding: 14px 16px 8px;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .search-box {
      flex: 1; min-width: 160px;
      display: flex; align-items: center;
      background: var(--white); border: 1.5px solid var(--gray-200);
      border-radius: var(--radius); padding: 0 12px;
      box-shadow: var(--shadow);
    }
    .search-box input {
      border: none; outline: none; flex: 1;
      font-size: .9rem; padding: 10px 8px 10px 0;
      background: transparent; color: var(--gray-800);
    }
    .search-box span { color: var(--gray-400); font-size: 1rem; }

    .filter-btns { display: flex; gap: 6px; }
    .filter-btn {
      border: 1.5px solid var(--gray-200); background: var(--white);
      border-radius: 99px; padding: 8px 14px;
      font-size: .8rem; cursor: pointer; color: var(--gray-600);
      transition: all .18s; font-weight: 500;
    }
    .filter-btn.active {
      background: var(--blue); border-color: var(--blue);
      color: var(--white);
    }

    /* ── Grid ── */
    .section-title {
      padding: 6px 16px 4px;
      font-size: .78rem; font-weight: 700;
      color: var(--gray-400); text-transform: uppercase; letter-spacing: .05em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px; padding: 8px 16px 100px;
    }

    /* ── Card ── */
    .card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s;
      position: relative;
      border: 1.5px solid var(--gray-200);
      text-decoration: none; color: inherit;
      display: flex; flex-direction: column;
    }
    .card:hover  { transform: translateY(-3px); box-shadow: 0 6px 24px rgba(0,0,0,.13); }
    .card:active { transform: scale(.97); }

    .card-top {
      height: 6px;
      background: var(--gray-200);
    }
    .card-top.done   { background: var(--green); }
    .card-top.active { background: var(--blue); }

    .card-body { padding: 12px 12px 10px; flex: 1; }
    .card-day  { font-size: .68rem; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: .05em; }
    .card-title { font-size: .92rem; font-weight: 700; margin-top: 2px; line-height: 1.3; }
    .card-topic { font-size: .75rem; color: var(--gray-600); margin-top: 4px; line-height: 1.4; }

    .card-footer {
      padding: 8px 12px;
      border-top: 1px solid var(--gray-100);
      display: flex; align-items: center; justify-content: space-between;
    }
    .phases {
      display: flex; gap: 3px; flex-wrap: wrap;
    }
    .phase-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--gray-200);
    }
    .phase-dot.done { background: var(--green); }

    .badge {
      font-size: .65rem; font-weight: 700; padding: 2px 7px;
      border-radius: 99px; text-transform: uppercase;
    }
    .badge-done   { background: #d1fae5; color: #065f46; }
    .badge-active { background: var(--blue-lt); color: var(--blue-dk); }
    .badge-new    { background: var(--gray-100); color: var(--gray-400); }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 60px 24px; color: var(--gray-400); }
    .empty .ico { font-size: 2.5rem; }
    .empty p { margin-top: 8px; font-size: .9rem; }

    /* ── Offline banner ── */
    #offline-banner {
      display: none;
      background: var(--amber); color: var(--white);
      text-align: center; padding: 8px;
      font-size: .82rem; font-weight: 600;
    }

    /* ── Install prompt ── */
    #install-bar {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--blue-dk); color: var(--white);
      padding: 14px 16px;
      display: none; align-items: center; justify-content: space-between;
      gap: 10px; z-index: 200;
      box-shadow: 0 -4px 16px rgba(0,0,0,.2);
    }
    #install-bar p { font-size: .85rem; flex: 1; }
    #install-bar .btn-install {
      background: var(--white); color: var(--blue-dk);
      border: none; border-radius: 8px;
      padding: 8px 18px; font-weight: 700; cursor: pointer; font-size: .85rem;
    }
    #install-bar .btn-close {
      background: transparent; color: rgba(255,255,255,.6);
      border: none; font-size: 1.3rem; cursor: pointer; padding: 0 4px;
    }
  </style>
</head>
<body>

<div id="offline-banner">📡 Đang offline — nội dung đã được lưu cache sẵn</div>

<header>
  <h1>🇺🇸 Tự Học Tiếng Anh</h1>
  <p>1 giờ mỗi ngày · 30 ngày hoàn thành</p>

  <div class="stats-row">
    <div class="stat"><div class="val" id="s-done">0</div><div class="lbl">Đã học</div></div>
    <div class="stat"><div class="val">30</div><div class="lbl">Tổng bài</div></div>
    <div class="stat"><div class="val" id="s-pct">0%</div><div class="lbl">Hoàn thành</div></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="prog-bar" style="width:0%"></div>
  </div>
  <div class="progress-label" id="prog-label">0/30 bài · 0% hoàn thành</div>
</header>

<div class="toolbar">
  <div class="search-box">
    <span>🔍</span>
    <input id="search" type="search" placeholder="Tìm bài học..." autocomplete="off" />
  </div>
  <div class="filter-btns">
    <button class="filter-btn active" data-f="all">Tất cả</button>
    <button class="filter-btn" data-f="done">✅ Xong</button>
    <button class="filter-btn" data-f="todo">📖 Chưa học</button>
  </div>
</div>

<div class="section-title" id="count-label">📚 Tất cả 30 bài học</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">
  <div class="ico">🔎</div>
  <p>Không tìm thấy bài học nào</p>
</div>

<div id="install-bar">
  <p>📲 Cài app để học offline không cần mạng!</p>
  <button class="btn-install" id="btn-install">Cài ngay</button>
  <button class="btn-close" id="btn-close-install">✕</button>
</div>

// ─────────────────────────────────────────
//  STORAGE — lưu tiến độ vào localStorage
// ─────────────────────────────────────────
const STORE_KEY = 'tienganh_progress_v1';

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}
function saveProgress(obj) {
  localStorage.setItem(STORE_KEY, JSON.stringify(obj));
}

let progress = loadProgress();   // { "Day1": { done: true, phases: [true,false,...] }, ... }

function isDone(lesson) {
  const k = `Day${lesson.day}`;
  return progress[k]?.done === true;
}

// ─────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────
let currentFilter = 'all';
let searchQ = '';

function render() {
  const grid  = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const label = document.getElementById('count-label');

  let filtered = LESSONS.filter(l => {
    const q = searchQ.trim().toLowerCase();
    const match = !q || l.title.toLowerCase().includes(q) || l.topic.toLowerCase().includes(q) || String(l.day).includes(q);
    const done = isDone(l);
    if (currentFilter === 'done' && !done) return false;
    if (currentFilter === 'todo' &&  done) return false;
    return match;
  });

  label.textContent = `📚 ${
    currentFilter === 'all'  ? 'Tất cả' :
    currentFilter === 'done' ? '✅ Đã hoàn thành' : '📖 Chưa học'
  } — ${filtered.length} bài`;

  grid.innerHTML = '';

  if (!filtered.length) { empty.style.display = ''; return; }
  empty.style.display = 'none';

  filtered.forEach(l => {
    const done = isDone(l);
    const k    = `Day${l.day}`;
    const phDone = progress[k]?.phases || [];
    const nextDay = LESSONS.find(x => !isDone(x));
    const isNext  = nextDay?.day === l.day;

    const card = document.createElement('a');
    card.href  = l.url;
    card.className = 'card';

    const topCls = done ? 'done' : (isNext ? 'active' : '');
    const badge  = done
      ? `<span class="badge badge-done">✓ Xong</span>`
      : (isNext ? `<span class="badge badge-active">👈 Tiếp theo</span>` : `<span class="badge badge-new">Chưa học</span>`);

    const dots = l.phases.map((_, i) =>
      `<div class="phase-dot${phDone[i] ? ' done' : ''}"></div>`
    ).join('');

    card.innerHTML = `
      <div class="card-top ${topCls}"></div>
      <div class="card-body">
        <div class="card-day">Ngày ${l.day}</div>
        <div class="card-title">${l.title}</div>
        <div class="card-topic">${l.topic}</div>
      </div>
      <div class="card-footer">
        <div class="phases">${dots}</div>
        ${badge}
      </div>
    `;

    grid.appendChild(card);
  });

  updateStats();
}

function updateStats() {
  const done = LESSONS.filter(isDone).length;
  const pct  = Math.round(done / LESSONS.length * 100);
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-pct').textContent  = pct + '%';
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${done}/30 bài · ${pct}% hoàn thành`;
}

// ─────────────────────────────────────────
//  EVENTS
// ─────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value;
  render();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.f;
    render();
  });
});

// ─────────────────────────────────────────
//  PWA — Service Worker
// ─────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered', r.scope))
      .catch(e => console.log('SW error', e));
  });
}

// ─────────────────────────────────────────
//  PWA — Install prompt
// ─────────────────────────────────────────
let deferredPrompt;
const installBar   = document.getElementById('install-bar');
const btnInstall   = document.getElementById('btn-install');
const btnCloseInst = document.getElementById('btn-close-install');

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  installBar.style.display = 'flex';
});

btnInstall.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBar.style.display = 'none';
});

btnCloseInst.addEventListener('click', () => {
  installBar.style.display = 'none';
});

// ─────────────────────────────────────────
//  Offline banner
// ─────────────────────────────────────────
window.addEventListener('offline', () => {
  document.getElementById('offline-banner').style.display = 'block';
});
window.addEventListener('online', () => {
  document.getElementById('offline-banner').style.display = 'none';
});

// ─────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────
render();
</script>
</body>
</html>
